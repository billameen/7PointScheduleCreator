<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talley Event Schedule</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js" type="module"></script>
</head>

<body>

    <header>
        <h1>Talley Event Schedule</h1>
        <p class="subtitle">Complete visual overview of daily operations and tasks.</p>
    </header>

    <main class="schedule-container">
        <div id="header-wrapper" class="schedule-header">
            <div class="header-cell">Time</div>
            <div class="header-cell">Unlock</div>
            <div class="header-cell">Greet</div>
            <div class="header-cell">Reset</div>
            <div class="header-cell">Lock</div>
            <div class="header-cell">Other</div>
        </div>

        <div id="schedule-body">
            <!-- time slots in here -->
        </div>
    </main>

    <template id="time-slot-template">
        <div class="time-row">
            <div class="time-cell"></div>
            <div class="task-cell unlock" data-label="Unlock">
                <div class="task-items"></div>
            </div>
            <div class="task-cell greet" data-label="Greet">
                <div class="task-items"></div>
            </div>
            <div class="task-cell reset" data-label="Reset">
                <div class="task-items"></div>
            </div>
            <div class="task-cell lock" data-label="Lock">
                <div class="task-items"></div>
            </div>
            <div class="task-cell other" data-label="Other">
                <div class="task-items"></div>
            </div>
        </div>
    </template>

    <template id="task-item-template">
        <div class="task-item">
            <span class="room-number"></span>
            <span class="setup-desc"></span>
        </div>
    </template>

</body>

</html>
